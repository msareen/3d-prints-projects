# Builds the project showcase (showcase/build.py) and publishes it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Showcase

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "showcase/**"
      - ".claude/skills/3d-design-pipeline/scripts/scrub.py"
      - ".github/workflows/showcase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site (fails if a published photo still has GPS)
        run: python -I showcase/build.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
