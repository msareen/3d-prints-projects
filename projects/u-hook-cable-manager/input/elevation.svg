<text x="626.8" y="804.75" font-size="12" fill="#c60">lid knuckle 3.5</text>
<text x="626.8" y="758.0" font-size="12" fill="#000">base tongue 4.4 (on the plate)</text>
<text x="626.8" y="711.25" font-size="12" fill="#c60">lid knuckle 3.5</text>
<text x="842.8" y="698.0" font-size="12">Two 45 deg cone pins on the tongue;</text>
<text x="842.8" y="714.0" font-size="12">Ø2.4 x 1.2, in cone sockets with 0.3 gap:</text>
<text x="842.8" y="730.0" font-size="12">the lid knuckles flex and snap over them.</text>
<text x="842.8" y="746.0" font-size="12">Gaps 0.3 between all moving faces.</text>
<text x="40" y="640" font-size="12" fill="#000" font-weight="bold">Changes from v3</text>
<text x="40" y="658" font-size="12" fill="#000">- lid = the whole rounded U (was a fixed U + flat bar)</text>
<text x="40" y="676" font-size="12" fill="#000">- flush 3-knuckle hinge along the cable (was rings sticking out)</text>
<text x="40" y="694" font-size="12" fill="#000">- loop 40 wide (user), cavity 35.2 x 12; loop 40 x 20 x 12</text>
<text x="40" y="712" font-size="12" fill="#000">- wall 2.4 (reference 4-5); loop centred on the 20 mm plate</text>
<text x="40" y="730" font-size="12" fill="#000" font-weight="bold">Printing (assistant choice, see chat)</text>
<text x="40" y="748" font-size="12" fill="#c00">- lids: printed flat on the bed and snapped onto</text>
<text x="40" y="766" font-size="12" fill="#c00">  the hinge cones (not print-in-place), see chat</text>
<text x="40" y="784" font-size="12" fill="#c00">- small 45 deg chamfers under the base strip ends</text>
<text x="40" y="802" font-size="12" fill="#c00">  so the plate part prints upright without support</text>
</svg>