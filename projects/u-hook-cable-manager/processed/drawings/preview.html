const bin=atob(B64), buf=new Uint8Array(bin.length);
for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
const pos=new Float32Array(buf.buffer);
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.computeVertexNormals();
const bounds=[[-10.0, -18.4, 0.0], [30.0, 4.75, 53.0]];
const centre=new THREE.Vector3((bounds[0][0]+bounds[1][0])/2,(bounds[0][1]+bounds[1][1])/2,(bounds[0][2]+bounds[1][2])/2);
const size=Math.max(bounds[1][0]-bounds[0][0],bounds[1][1]-bounds[0][1],bounds[1][2]-bounds[0][2]);
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xeef1f6);
const cam=new THREE.PerspectiveCamera(35,1,1,2000); cam.up.set(0,0,1);
scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,0.9));
const dl=new THREE.DirectionalLight(0xffffff,0.8); dl.position.set(-40,-80,120); scene.add(dl);
const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xe8575a,roughness:0.55,metalness:0.0,flatShading:false}));
mesh.position.sub(centre); scene.add(mesh);
const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo,28),new THREE.LineBasicMaterial({color:0x5a1a1c}));
edges.position.copy(mesh.position); scene.add(edges);
const grid=new THREE.GridHelper(180,18,0x99a,0xccd); grid.rotation.x=Math.PI/2; grid.position.z=bounds[0][2]-centre.z; scene.add(grid);
let az=-0.9, el=0.5, dist=size*3.2, target=new THREE.Vector3();
function place(){const c=Math.cos(el);cam.position.set(target.x+dist*c*Math.sin(az),target.y-dist*c*Math.cos(az),target.z+dist*Math.sin(el));cam.lookAt(target);}
const views={iso:[-0.9,0.5],front:[0,0],back:[Math.PI,0],right:[Math.PI/2,0],top:[0,1.5607]};
document.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{[az,el]=views[b.dataset.v];target.set(0,0,0);place();});
document.getElementById('edges').onchange=e=>edges.visible=e.target.checked;
let drag=null;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;

canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(size*0.8,Math.min(size*8,dist*Math.exp(e.deltaY*0.001)));place();},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',()=>{resize();});
